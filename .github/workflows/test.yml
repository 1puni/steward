# Runs the README's development test command on Linux, the platform the
# harness deploys to. Nothing here is skipped or filtered: a test that needs
# something the hosted runner lacks fails visibly.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite takes about fifteen minutes locally.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # The floor of `requires-python` in pyproject.toml.
          python-version: "3.11"
      - name: Run the test suite
        run: uv run --extra dev python -m pytest -q -p no:cacheprovider
