<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task board</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 16%, transparent);
    --accent: var(--tg-theme-button-color, #2481cc); --muted: var(--tg-theme-hint-color, light-dark(#667785, #a7b7c6)); }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 48rem; padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem 2rem;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--tg-theme-bg-color, light-dark(#ffffff, #17212b));
    color: var(--tg-theme-text-color, light-dark(#17212b, #f5f8fa)); }
  h1 { font-size: 1.85rem; letter-spacing: -.035em; line-height: 1.2; margin: 0; }
  h2 { font-size: 1.1rem; line-height: 1.4; margin: 0; overflow-wrap: anywhere; }
  h3 { font-size: .95rem; margin: 1.25rem 0 .35rem; }
  p { margin: .35rem 0; }
  #counts, .meta, .help { color: var(--muted); font-size: .85rem; }
  #counts { margin: .5rem 0 1.25rem; }
  input { display: block; width: 100%; font: inherit; padding: .7rem .9rem; color: inherit;
    background: var(--tg-theme-secondary-bg-color, light-dark(#f0f4f7, #232e3c));
    border: 1px solid transparent; border-radius: .6rem; }
  input::placeholder { color: var(--muted); opacity: 1; }
  nav { display: flex; gap: .4rem; margin: .9rem 0 1.1rem; flex-wrap: wrap; }
  button { font: inherit; color: inherit; cursor: pointer; }
  nav button, #back { background: transparent; border: 1px solid var(--line); border-radius: 2rem; padding: .4rem .85rem; font-size: .9rem; }
  nav button[aria-pressed="true"] { background: var(--accent); color: var(--tg-theme-button-text-color, #fff); border-color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .task { display: block; text-align: left; width: 100%; background: transparent;
    border: 0; border-top: 1px solid var(--line); padding: 1rem 0; }
  .task:hover h2 { color: var(--accent); }
  .task .meta { display: flex; flex-wrap: wrap; gap: .3rem .8rem; margin-top: .4rem; }
  .badge { color: var(--tg-theme-text-color, inherit); font-weight: 600; }
  .reason { font-size: .9rem; margin: .6rem 0 0; overflow-wrap: anywhere; }
  #back { margin-bottom: 1.25rem; }
  #detail .meta { margin: .5rem 0 1.25rem; }
  .prose { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .95rem; }
  .discussion { display: inline-block; color: var(--accent); padding: .65rem 0; }
  .command { display: block; width: 100%; text-align: left; padding: .75rem; margin-top: .5rem;
    background: var(--tg-theme-secondary-bg-color, light-dark(#f0f4f7, #232e3c));
    border: 1px solid var(--line); border-radius: .4rem; overflow-wrap: anywhere; }
  details { font-size: .85rem; margin-top: 1.5rem; overflow-wrap: anywhere; }
  #error { padding: .8rem; border-left: 3px solid #c0392b; margin: 1rem 0; }
  #empty { padding: 2rem 0; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><h1>Task board</h1><p id="counts" aria-live="polite">Loading tasks…</p></header>
<div id="error" role="alert" hidden></div>
<section id="board" aria-label="Tasks">
  <input id="search" type="search" placeholder="Find a task…" aria-label="Search tasks">
  <nav aria-label="Filter tasks">
    <button data-filter="active" aria-pressed="true">In progress</button>
    <button data-filter="attention" aria-pressed="false">Needs you</button>
    <button data-filter="all" aria-pressed="false">All tasks</button>
  </nav>
  <div id="tasks"></div><p id="empty" hidden></p>
</section>
<section id="detail" aria-label="Task details" hidden>
  <button id="back">‹ All tasks</button><div id="content"></div>
</section>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/tasks/app.js"></script>
</body>
</html>
